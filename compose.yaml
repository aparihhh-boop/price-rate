services:
  app:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      MEOWMI_DATA_FILE: /data/meowmi.json
      MEOWMI_UPLOAD_DIR: /data/uploads
      MEOWMI_ADMIN_PASSWORD: ${MEOWMI_ADMIN_PASSWORD:?Set a strong MEOWMI_ADMIN_PASSWORD in .env}
    volumes:
      - meowmi_data:/data
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Set SITE_ADDRESS to your public domain in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  meowmi_data:
  caddy_data:
  caddy_config:
